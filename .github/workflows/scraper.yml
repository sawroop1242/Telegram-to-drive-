name: Telegram to GDrive Archiver

on:
  workflow_dispatch:

jobs:
  scrape_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      RCLONE_CONF_JSON: ${{ secrets.RCLONE_CONF }}
      RCLONE_REMOTE_ROOT: gdrive1:Telegram_Archive/GK-GS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon cryptg

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Configure Rclone gdrive1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive1]
          type = drive
          scope = drive
          token = ${RCLONE_CONF_JSON}
          EOF

          echo "Configured remotes:"
          rclone listremotes

          echo "Testing gdrive1 connection..."
          rclone about gdrive1:

      - name: Run Parallel Telegram Scraper
        run: |
          python parallel_runner.py

      - name: Verify Downloaded Archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="./downloads/Telegram_Archive/GK-GS"

          echo "Local archive: $ROOT"
          if [ ! -d "$ROOT" ]; then
            echo "ERROR: archive directory does not exist"
            exit 1
          fi

          echo "Downloaded files:"
          find "$ROOT" -type f -not -name '.DS_Store' -not -name '.download_manifest.json' -not -name '*.part' -print

          echo "File counts by type:"
          find "$ROOT" -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.avi' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.m4v' -o -iname '*.3gp' \) | wc -l | xargs echo "Videos:"
          find "$ROOT" -type f -iname '*.pdf' | wc -l | xargs echo "PDFs:"

      - name: Verify Google Drive Uploads
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_ROOT="gdrive1:Telegram_Archive/GK-GS"

          echo "Google Drive archive summary:"
          rclone size "$REMOTE_ROOT"
          rclone lsd "$REMOTE_ROOT" || true
          echo "Parallel per-file upload workflow completed."

name: Telegram to GDrive Archiver

# This allows you to trigger the script manually from the Actions tab
on:
  workflow_dispatch:

jobs:
  scrape_and_upload:
    runs-on: ubuntu-latest

    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      RCLONE_CONF_JSON: ${{ secrets.RCLONE_CONF }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon cryptg

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone Connection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = $RCLONE_CONF_JSON
          EOF

          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Prepare Colab-compatible local folder structure
        run: |
          set -euo pipefail
          # The Python application uses ./downloads/Telegram_Archive/GK-GS.
          # A Google Drive FUSE mount is NOT required because main.py uploads
          # completed files directly with rclone copyto.
          mkdir -p ./downloads/Telegram_Archive/GK-GS
          echo "Local archive root: $(pwd)/downloads/Telegram_Archive/GK-GS"
          test -d ./downloads/Telegram_Archive/GK-GS

      - name: Run Telegram Scraper
        run: |
          set -euo pipefail
          python main.py

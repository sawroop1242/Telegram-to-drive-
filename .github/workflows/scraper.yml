name: Telegram to GDrive Archiver

# This allows you to trigger the script manually from the Actions tab
on:
  workflow_dispatch:

jobs:
  scrape_and_upload:
    runs-on: ubuntu-latest

    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      RCLONE_CONF_JSON: ${{ secrets.RCLONE_CONF }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon cryptg

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone Connection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = {"access_token":"ya29.a0AehfTOmnlPrZrOpSxnos46zkFf3EbfaQrsAdAUZHSDa1WXSo1uffGGR8lB2r6T5HWNKETo4nLtjb_4Qfx51so7k80LLFlfcUsfMu3cCxnVclalz9ahu5yRMH-qtJN_Z8jeRzlo1aqKZW7YVirhNVvo8Hr_rukSyKSDn3StSUWVIta3bHdSjbaRJp7Ly3fZbQgBIsZYMaCgYKAWMSARcSFQHGX2MiQgH96Z-VyCUQv9Tlpt5VEA0206","token_type":"Bearer","refresh_token":"1//0gy8mBt8W8OJeCgYIARAAGBASSQF-L9IrSocnW7Nca0gxlr08WL9uPWu9X6KQRXiopVm_gzmMk7iy7m97TeMfuEMuMSnF7vhwJ9Lb8WycMEmgwCENSvXXqhcOEAY","expiry":"2026-11-18T10:48:57.0728336+05:30","expires_in":3599}
          EOF

          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Mount Google Drive
        run: |
          # Replicate the Colab folder structure
          sudo mkdir -p /content/drive/MyDrive
          sudo chown -R $USER:$USER /content
          
          # Mount the drive in the background via daemon
          rclone mount gdrive: /content/drive/MyDrive --daemon --vfs-cache-mode writes
          
          # Give it a few seconds to establish the connection
          sleep 5 

      - name: Run Telegram Scraper
        run: |
          python main.py

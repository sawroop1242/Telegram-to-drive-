name: Manual Live Stream Archiver

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'Paste YouTube Stream Link'
        required: true
        type: string

jobs:
  archive_stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Archiving Engines
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg rclone fuse3
        python -m pip install --upgrade pip
        pip install yt-dlp

    - name: Configure Rclone Connection
      env:
        
        RCLONE_CONF_JSON: ${{ vars.RCLONE_CONF }}
      run: |
        mkdir -p ~/.config/rclone
        # Compiles the required structural parameters into memory dynamically
        cat << EOF > ~/.config/rclone/rclone.conf
        [gdrive]
        type = drive
        scope = drive
        token = "$RCLONE_CONF_JSON"
        EOF

    - name: Mount Google Drive
      run: |
        # Replicate the Colab folder storage layout structure matching your script paths
        sudo mkdir -p /content/drive/MyDrive
        sudo chown -R $USER:$USER /content
        
        # Mount the remote cloud storage in the background as a background daemon
        rclone mount gdrive: /content/drive/MyDrive --daemon --vfs-cache-mode writes
        
        # Pause execution briefly to let the mounting background pipeline establish connection links
        sleep 5 

    - name: Execute Stream Capture Loop
      env:
        STREAM_LINK: ${{ inputs.stream_url }}
      run: |
        python stream_processor.py
        

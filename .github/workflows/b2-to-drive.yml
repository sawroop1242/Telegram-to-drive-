
name: Backblaze B2 to Google Drive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-to-google-drive
  cancel-in-progress: false

jobs:
  backup:
    name: Transfer B2 to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version


          
      - name: Configure rclone
        env:
          B2_ACCOUNT_ID: ${{ secrets.B2_ACCOUNT_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Reject missing or multiline B2 credentials
          test -n "$B2_ACCOUNT_ID"
          test -n "$B2_APPLICATION_KEY"
          [[ "$B2_ACCOUNT_ID" != *$'\n'* ]]
          [[ "$B2_APPLICATION_KEY" != *$'\n'* ]]

          # Validate OAuth JSON
          printf '%s' "$GDRIVE_TOKEN" | jq -e '
            type == "object" and
            (.access_token | type == "string" and length > 0) and
            (.refresh_token | type == "string" and length > 0)
          ' >/dev/null

          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"

          # Build a proper rclone config using rclone's own config commands
          export RCLONE_CONFIG_B2_TYPE=b2
          export RCLONE_CONFIG_B2_ACCOUNT="$B2_ACCOUNT_ID"
          export RCLONE_CONFIG_B2_KEY="$B2_APPLICATION_KEY"

          export RCLONE_CONFIG_GDRIVE_TYPE=drive
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive
          export RCLONE_CONFIG_GDRIVE_TOKEN
          RCLONE_CONFIG_GDRIVE_TOKEN="$(printf '%s' "$GDRIVE_TOKEN" | jq -c .)"

          # Create an empty config file; environment variables provide credentials
          : > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

          # Verify configuration parsing
          rclone listremotes





      - name: Debug rclone configuration
        shell: bash
        run: |
          echo "Checking rclone configuration..."

          CONFIG="$HOME/.config/rclone/rclone.conf"

          if [ ! -f "$CONFIG" ]; then
            echo "Config file missing"
            exit 1
          fi

          echo "Configuration sections:"
          grep '^\[' "$CONFIG"

          echo "Configuration keys:"
          sed -E 's/^([[:space:]]*[^=]+)=.*/\1=[REDACTED]/' "$CONFIG"

          echo "Testing configuration:"
          rclone listremotes

      - name: Verify Backblaze B2 connection
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$B2_BUCKET"
          rclone lsd "b2:"
          rclone lsf "b2:${B2_BUCKET}" --max-depth 1

      - name: Verify Google Drive connection
        run: |
          set -euo pipefail
          rclone lsd gdrive:
          rclone about gdrive:

      - name: Transfer files
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail

          rclone copy \
            "b2:${B2_BUCKET}" \
            "gdrive:BackblazeBackup" \
            --transfers 8 \
            --checkers 16 \
            --progress \
            --stats 30s \
            --retries 5 \
            --low-level-retries 10 \
            --log-level INFO

      - name: Verify backup
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -euo pipefail

          echo "Checking source and destination..."

          rclone check \
            "b2:${B2_BUCKET}" \
            "gdrive:BackblazeBackup" \
            --one-way \
            --size-only

          echo "Backup verification completed."

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$HOME/.config/rclone/rclone.conf"
